# Build the production bundle (npm run build:dist) and deploy dist/ to GitHub
# Pages and to Cloudflare Pages. Whichever one webchirp-hosting points the
# domain in CNAME at (https://webchirp.org/) serves the app.
# Replaces the legacy Jekyll deployment that served the raw repo tree.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish so Pages history stays
# consistent, but skip intermediate queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build:catalog reads driver sources from the chirp/ submodule and
          # fails on a submodule/runtime-pin mismatch.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Build before testing, not after: three tests read web/radio-catalog.json
      # and the build regenerates it from the submodule pin, so this order tests
      # exactly what gets uploaded rather than the committed copy.
      - run: npm run build:dist
        env:
          # The Cloudflare Turnstile site key the RepeaterBook query form
          # renders its check with (web/js/turnstile.ts). A repository
          # variable, not a secret: the key is public and ends up in the page.
          # Unset builds a site with no check.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      # Everything except test:hw, which needs a radio on a serial port.
      # A failure here fails the job, so the deploy job (needs: build) is skipped
      # and the currently-deployed site stays up.
      - run: npm test
      - run: npm run check:python
      # Carry the currently-deployed generation of hashed assets into the new
      # artifact so a page loaded before the deploy keeps resolving the names
      # it references: GitHub Pages caches index.html for 10 minutes
      # (max-age=600, not configurable), Cloudflare Pages revalidates it on
      # every load, and on either host a long-open tab boots the runtime long
      # after it loaded. The host is read from ./CNAME rather than repeated
      # here, so a hostname change cannot leave this step pointing at a dead
      # site.
      - run: node scripts/retain-deployed-assets.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the same artifact to the Cloudflare Pages project that
  # webchirp-hosting's pages.tf creates. Which of the two hosts answers for
  # webchirp.org is decided there (webchirp_origin), not here. The apex points
  # at Cloudflare Pages now (checked 2026-10-30); both deploys keep running,
  # GitHub Pages as the fallback, until the GitHub Pages job is removed.
  # Skipped while CLOUDFLARE_ACCOUNT_ID is unset, as on a fork.
  deploy-cloudflare:
    needs: build
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://webchirp.org/
    steps:
      # upload-pages-artifact stores dist/ as a single tar named github-pages.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.20.0"
          command: pages deploy dist --project-name=webchirp --branch=master
