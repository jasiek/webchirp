# Runs the Playwright browser tests (npm run test:e2e, tests/e2e) against the
# built site on every pull request.
#
# A job of its own, apart from coverage.yml and pages.yml, because this one
# depends on things the unit suites must not: a Chromium download and the
# network, since the app loads Pyodide from jsDelivr. A CDN outage can fail
# this workflow and nothing else. It is not a required check unless the
# repository owner makes it one in the branch protection settings.
name: Browser tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # build:dist (which test:e2e runs first) builds the CHIRP archive
          # and the catalog from the submodule.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci

      # The browser is keyed on the Playwright version that downloads it, so a
      # Playwright bump fetches the build that version expects.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      # Headless runs use Chromium's headless shell, so that is all that is
      # downloaded. The system libraries it needs are not cached with it.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
